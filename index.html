<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tugas UT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Menyembunyikan scrollbar untuk tampilan mobile yang bersih */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Modal */
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: modalFadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">Tugas UT</h1>
                        <p class="text-xs text-slate-500 hidden sm:block">Sinkronisasi Cloud Aktif</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- User Profile & Logout -->
                    <div id="userProfileBtn" class="hidden items-center gap-2">
                        <div class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2">
                            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span id="userEmailDisplay" class="hidden sm:inline truncate max-w-[100px]">Anonim</span>
                        </div>
                    </div>
                    <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm shadow-indigo-200 transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span class="hidden sm:inline">Tambah Matkul</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <!-- Statistik -->
        <div class="grid grid-cols-3 gap-3 sm:gap-6 mb-8">
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-center">
                <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Mata Kuliah</span>
                <span class="text-2xl sm:text-3xl font-bold text-indigo-600" id="statMatkul">0</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-center">
                <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Selesai</span>
                <span class="text-2xl sm:text-3xl font-bold text-emerald-500" id="statDone">0</span>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-center">
                <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Tersisa</span>
                <span class="text-2xl sm:text-3xl font-bold text-amber-500" id="statLeft">0</span>
            </div>
        </div>

        <!-- Container Utama Dashboard -->
        <div id="dashboardContainer" class="space-y-8">
            <!-- Konten digenerate via JS -->
            <div class="text-center py-10 text-slate-400">
                Memuat data...
            </div>
        </div>
    </main>

    <div id="addModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl modal-animate overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">Tambah Mata Kuliah</h3>
                <button onclick="document.getElementById('addModal').classList.add('hidden')" class="text-slate-400 hover:bg-slate-100 p-2 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="addMatkulForm" class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">Semester</label>
                        <select id="matkulSemester" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">Kategori</label>
                        <select id="matkulKategori" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Wajib">Wajib</option>
                            <option value="Pilihan">Pilihan</option>
                            <option value="Praktik">Praktik/Praktikum</option>
                            <option value="TAP">TAP</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Kode Matkul</label>
                    <input type="text" id="matkulCode" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none uppercase" placeholder="Misal: EKMA4111">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Nama Matkul</label>
                    <input type="text" id="matkulName" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Misal: Pengantar Bisnis">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">Dosen 1 (Wajib)</label>
                        <input type="text" id="matkulDosen1" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nama Dosen">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">Dosen 2 (Opsional)</label>
                        <input type="text" id="matkulDosen2" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nama Dosen 2">
                    </div>
                </div>
                <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">Simpan Mata Kuliah</button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 transform transition-all duration-300 translate-y-24 opacity-0 bg-white rounded-2xl shadow-xl border border-slate-100 p-4 flex items-center z-[110] max-w-sm pointer-events-none">
        <div id="toastIcon" class="mr-3 flex-shrink-0"></div>
        <div><p id="toastMessage" class="text-sm font-bold text-slate-800"></p></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0RWNNQ-wxedZDlEEADkRpI5HmuCmgeiU",
            authDomain: "unoversitas-terbuka.firebaseapp.com",
            projectId: "unoversitas-terbuka",
            storageBucket: "unoversitas-terbuka.firebasestorage.app",
            messagingSenderId: "333591041068",
            appId: "1:333591041068:web:9a68ca3d9b13443a65ed89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let userId = null;
        let subjects = [];
        let semesterDates = {};
        let unsubSubjects = null;
        let unsubDates = null;
        const appId = "tugas_ut_v3";

        // Struktur Sesi UT (1-8), Sesi 3, 5, 7 digabung dengan Tugas
        const sessions = [
            { id: 's1', label: 'Sesi 1', isTask: false },
            { id: 's2', label: 'Sesi 2', isTask: false },
            { id: 's3', label: 'Sesi 3', isTask: false, hasTask: true, taskId: 't1', taskLabel: 'Tugas 1' },
            { id: 's4', label: 'Sesi 4', isTask: false },
            { id: 's5', label: 'Sesi 5', isTask: false, hasTask: true, taskId: 't2', taskLabel: 'Tugas 2' },
            { id: 's6', label: 'Sesi 6', isTask: false },
            { id: 's7', label: 'Sesi 7', isTask: false, hasTask: true, taskId: 't3', taskLabel: 'Tugas 3' },
            { id: 's8', label: 'Sesi 8', isTask: false }
        ];

        async function init() {
            onAuthStateChanged(auth, async (user) => {
                const userProfileBtn = document.getElementById('userProfileBtn');
                
                if (user) {
                    userId = user.uid;
                    document.getElementById('userEmailDisplay').textContent = "Siswa Anonim";
                    userProfileBtn.classList.remove('hidden');
                    userProfileBtn.classList.add('flex');
                    setupRealtimeListeners();
                } else {
                    userId = null;
                    userProfileBtn.classList.add('hidden');
                    userProfileBtn.classList.remove('flex');
                    if(unsubSubjects) unsubSubjects();
                    if(unsubDates) unsubDates();
                    document.getElementById('dashboardContainer').innerHTML = '';
                    updateStats(0,0,0);
                    
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        showToast("Gagal terhubung ke Cloud", "error");
                    }
                }
            });

            document.getElementById('addMatkulForm').addEventListener('submit', handleAddMatkul);
        }

        window.toggleDateSettings = function(semesterId) {
            const panel = document.getElementById(`datePanel-${semesterId}`);
            const icon = document.getElementById(`dateIcon-${semesterId}`);
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                panel.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function setupRealtimeListeners() {
            if (!userId) return;
            
            const subjectsRef = collection(db, `artifacts/${appId}/users/${userId}/matkul`);
            unsubSubjects = onSnapshot(subjectsRef, (snapshot) => {
                subjects = [];
                snapshot.forEach((doc) => { subjects.push({ id: doc.id, ...doc.data() }); });
                renderDashboard();
            });

            const datesRef = collection(db, `artifacts/${appId}/users/${userId}/dates`);
            unsubDates = onSnapshot(datesRef, (snapshot) => {
                semesterDates = {};
                snapshot.forEach((doc) => { semesterDates[doc.id] = doc.data(); });
                renderDashboard();
            });
        }

        async function handleAddMatkul(e) {
            e.preventDefault();
            if (!userId) return;

            const newMatkul = {
                code: document.getElementById('matkulCode').value.toUpperCase(),
                name: document.getElementById('matkulName').value,
                semester: document.getElementById('matkulSemester').value,
                kategori: document.getElementById('matkulKategori').value,
                dosen1: document.getElementById('matkulDosen1').value,
                dosen2: document.getElementById('matkulDosen2').value,
                tasks: {} // Format: { s1: true, t1: false, ... }
            };

            const docId = `mk_${Date.now()}`;
            try {
                await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, docId), newMatkul);
                document.getElementById('addModal').classList.add('hidden');
                document.getElementById('addMatkulForm').reset();
                showToast("Mata kuliah ditambahkan", "success");
            } catch (err) {
                showToast("Gagal menyimpan data", "error");
            }
        }

        window.deleteMatkul = async function(id) {
            if(confirm("Hapus mata kuliah ini?")) {
                await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, id));
                showToast("Mata kuliah dihapus", "success");
            }
        }

        window.toggleTask = async function(matkulId, taskId, isChecked) {
            const matkul = subjects.find(s => s.id === matkulId);
            if (!matkul) return;
            matkul.tasks[taskId] = isChecked;
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId), { tasks: matkul.tasks }, { merge: true });
        }

        window.updateNilai = async function(matkulId, itemId, value) {
            const matkul = subjects.find(s => s.id === matkulId);
            if (!matkul) return;
            if (!matkul.nilai) matkul.nilai = {};
            matkul.nilai[itemId] = value;
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId), { nilai: matkul.nilai }, { merge: true });
        }

        window.saveDates = async function(semesterId) {
            const newData = {};
            sessions.forEach(s => {
                newData[`start_${s.id}`] = document.getElementById(`date_start_${semesterId}_${s.id}`).value;
                newData[`end_${s.id}`] = document.getElementById(`date_end_${semesterId}_${s.id}`).value;
            });
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/dates`, semesterId), newData);
            showToast("Tanggal disimpan", "success");
        }

        function checkStatus(startDate, endDate, isCompleted) {
            if (isCompleted) return { color: 'bg-emerald-50 border-emerald-200', text: 'Selesai', badge: 'bg-emerald-100 text-emerald-700', active: true };
            if (!startDate || !endDate) return { color: 'bg-white border-slate-200', text: 'Set Tanggal', badge: 'bg-slate-100 text-slate-500', active: true };

            const now = new Date();
            const start = new Date(startDate);
            const end = new Date(endDate);
            end.setHours(23, 59, 59, 999); 

            if (now < start) return { color: 'bg-slate-50 border-slate-200 opacity-60', text: 'Belum Buka', badge: 'bg-slate-200 text-slate-500', active: false };
            if (now > end) return { color: 'bg-rose-50 border-rose-200', text: 'Terlewat', badge: 'bg-rose-100 text-rose-700', active: true };
            
            return { color: 'bg-blue-50 border-blue-200 shadow-sm', text: 'Aktif', badge: 'bg-blue-100 text-blue-700', active: true };
        }

        function formatDateShort(dateString) {
            if(!dateString) return '-';
            const d = new Date(dateString);
            return `${d.getDate()}/${d.getMonth()+1}`;
        }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            container.innerHTML = '';

            if (subjects.length === 0) {
                container.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
                    <div class="text-slate-400 mb-3"><svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
                    <p class="text-slate-500 font-medium">Belum ada mata kuliah yang ditambahkan.</p>
                </div>`;
                updateStats(0,0,0);
                return;
            }

            // Kelompokkan matkul by Semester
            const grouped = {};
            subjects.forEach(s => {
                if (!grouped[s.semester]) grouped[s.semester] = [];
                grouped[s.semester].push(s);
            });

            // Urutkan Semester
            const sortedSemesters = Object.keys(grouped).sort((a, b) => parseInt(a) - parseInt(b));
            let totalDone = 0; let totalTarget = 0;

            sortedSemesters.forEach(sem => {
                const semDates = semesterDates[`sem_${sem}`] || {};
                
                // HTML Header Semester + Date Settings Dropdown
                let html = `
                <div class="mb-10">
                    <div class="flex items-center justify-between bg-indigo-900 text-white p-4 rounded-t-2xl shadow-md">
                        <div class="flex items-center gap-3">
                            <span class="bg-indigo-700 px-3 py-1 rounded-lg font-bold">SMT ${sem}</span>
                            <span class="font-medium text-indigo-100 text-sm hidden sm:block">${grouped[sem].length} Mata Kuliah</span>
                        </div>
                        <button onclick="toggleDateSettings('sem_${sem}')" class="flex items-center gap-2 text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span class="hidden sm:inline">Setel Tanggal</span>
                            <svg id="dateIcon-sem_${sem}" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>

                    <!-- Date Setup Panel (Hidden by default) -->
                    <div id="datePanel-sem_${sem}" class="hidden bg-white border-x border-b border-slate-200 p-4 rounded-b-2xl mb-4 shadow-sm">
                        <p class="text-sm text-slate-500 mb-4 font-medium"><span class="text-indigo-600 font-bold">INFO:</span> Tanggal yang diisi di sini berlaku untuk semua mata kuliah di Semester ${sem}.</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                        
                        sessions.forEach(ses => {
                            const startVal = semDates[`start_${ses.id}`] || '';
                            const endVal = semDates[`end_${ses.id}`] || '';
                            html += `
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                <div class="font-bold text-xs text-slate-700 mb-2">${ses.label}</div>
                                <input type="date" id="date_start_sem_${sem}_${ses.id}" value="${startVal}" class="w-full text-xs p-1 mb-1 border rounded bg-white" title="Mulai">
                                <input type="date" id="date_end_sem_${sem}_${ses.id}" value="${endVal}" class="w-full text-xs p-1 border rounded bg-white" title="Akhir">
                            </div>`;
                        });

                html += `</div>
                        <div class="mt-4 flex justify-end">
                            <button onclick="saveDates('sem_${sem}')" class="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700">Simpan Tanggal</button>
                        </div>
                    </div>

                    <div class="space-y-4 mt-4">`;

                // Render Matkul Cards
                grouped[sem].forEach(matkul => {
                    html += `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row">
                        <!-- Matkul Info (Kiri) -->
                        <div class="bg-slate-50/50 p-4 border-b md:border-b-0 md:border-r border-slate-200 w-full md:w-64 flex-shrink-0 relative group">
                            <button onclick="deleteMatkul('${matkul.id}')" class="absolute top-3 right-3 text-slate-300 hover:text-rose-500 transition-colors bg-white rounded-full p-1 shadow-sm opacity-0 group-hover:opacity-100" title="Hapus">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                            <span class="inline-block px-2 py-1 bg-indigo-100 text-indigo-700 text-[10px] font-bold rounded mb-2">${matkul.kategori}</span>
                            <h3 class="font-bold text-slate-800 text-lg leading-tight mb-1">${matkul.code}</h3>
                            <p class="text-sm font-medium text-slate-600 mb-3">${matkul.name}</p>
                            <div class="text-xs text-slate-500 flex items-start gap-1">
                                <svg class="w-3.5 h-3.5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                <div>
                                    <div class="truncate">${matkul.dosen1}</div>
                                    ${matkul.dosen2 ? `<div class="truncate mt-0.5">${matkul.dosen2}</div>` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Sessions Scrollable (Kanan) -->
                        <div class="p-4 flex gap-3 overflow-x-auto hide-scrollbar snap-x">`;
                        
                        sessions.forEach(ses => {
                            const startDate = semDates[`start_${ses.id}`];
                            const endDate = semDates[`end_${ses.id}`];
                            
                            // DISKUSI
                            totalTarget++;
                            const isDiskusiDone = matkul.tasks?.[ses.id] || false;
                            if(isDiskusiDone) totalDone++;
                            
                            const statusDiskusi = checkStatus(startDate, endDate, isDiskusiDone);
                            const nilaiDiskusi = matkul.nilai?.[ses.id] || '';

                            html += `
                            <div class="snap-start flex gap-2 flex-shrink-0">
                                <!-- Kartu Diskusi -->
                                <div class="w-36 rounded-xl border p-3 flex flex-col transition-all ${statusDiskusi.color}">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold text-slate-700">Diskusi ${ses.id.replace('s','')}</span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${statusDiskusi.badge}">${statusDiskusi.text}</span>
                                    </div>
                                    <div class="text-[10px] text-slate-500 mb-3 bg-white/50 px-1.5 py-0.5 rounded text-center font-medium">
                                        ${formatDateShort(startDate)} - ${formatDateShort(endDate)}
                                    </div>
                                    <div class="mt-auto space-y-2">
                                        <label class="flex items-center gap-2 cursor-pointer group">
                                            <input type="checkbox" ${isDiskusiDone ? 'checked' : ''} ${!statusDiskusi.active ? 'disabled' : ''} 
                                                onchange="toggleTask('${matkul.id}', '${ses.id}', this.checked)"
                                                class="w-4 h-4 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500 cursor-pointer disabled:opacity-50">
                                            <span class="text-xs font-medium ${isDiskusiDone ? 'line-through text-slate-400' : 'text-slate-700'} group-hover:text-emerald-600">Selesai</span>
                                        </label>
                                        <input type="number" placeholder="Nilai" value="${nilaiDiskusi}" ${!statusDiskusi.active ? 'disabled' : ''}
                                            onchange="updateNilai('${matkul.id}', '${ses.id}', this.value)"
                                            class="w-full text-xs p-1.5 rounded bg-white border border-slate-200 outline-none focus:border-indigo-400 disabled:opacity-50 font-bold text-indigo-700 text-center hide-scrollbar" style="-moz-appearance: textfield;">
                                    </div>
                                </div>`;

                            // TUGAS (Jika ada di sesi ini)
                            if (ses.hasTask) {
                                totalTarget++;
                                const isTugasDone = matkul.tasks?.[ses.taskId] || false;
                                if(isTugasDone) totalDone++;
                                const statusTugas = checkStatus(startDate, endDate, isTugasDone);
                                const nilaiTugas = matkul.nilai?.[ses.taskId] || '';

                                html += `
                                <!-- Kartu Tugas -->
                                <div class="w-36 rounded-xl border p-3 flex flex-col transition-all border-l-4 border-l-indigo-400 ${statusTugas.color}">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold text-indigo-800">${ses.taskLabel}</span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${statusTugas.badge}">${statusTugas.text}</span>
                                    </div>
                                    <div class="text-[10px] text-slate-500 mb-3 bg-white/50 px-1.5 py-0.5 rounded text-center font-medium">
                                        Sama dgn Sesi ${ses.id.replace('s','')}
                                    </div>
                                    <div class="mt-auto space-y-2">
                                        <label class="flex items-center gap-2 cursor-pointer group">
                                            <input type="checkbox" ${isTugasDone ? 'checked' : ''} ${!statusTugas.active ? 'disabled' : ''} 
                                                onchange="toggleTask('${matkul.id}', '${ses.taskId}', this.checked)"
                                                class="w-4 h-4 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500 cursor-pointer disabled:opacity-50">
                                            <span class="text-xs font-medium ${isTugasDone ? 'line-through text-slate-400' : 'text-slate-700'} group-hover:text-emerald-600">Selesai</span>
                                        </label>
                                        <input type="number" placeholder="Nilai Tugas" value="${nilaiTugas}" ${!statusTugas.active ? 'disabled' : ''}
                                            onchange="updateNilai('${matkul.id}', '${ses.taskId}', this.value)"
                                            class="w-full text-xs p-1.5 rounded bg-white border border-slate-200 outline-none focus:border-indigo-400 disabled:opacity-50 font-bold text-indigo-700 text-center hide-scrollbar" style="-moz-appearance: textfield;">
                                    </div>
                                </div>`;
                            }

                            html += `</div>`; // End of snap-start group
                        });

                html += `</div>
                    </div>`; // End Matkul Card
                });

                html += `</div></div>`; // End Semester Group
                container.innerHTML += html;
            });

            updateStats(subjects.length, totalDone, totalTarget - totalDone);
        }

        function updateStats(matkul, done, left) {
            document.getElementById('statMatkul').textContent = matkul;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statLeft').textContent = left;
        }

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');
            
            msgEl.textContent = msg;
            if(type === 'success') {
                iconEl.innerHTML = `<div class="bg-emerald-100 text-emerald-600 p-1.5 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>`;
            } else {
                iconEl.innerHTML = `<div class="bg-rose-100 text-rose-600 p-1.5 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>`;
            }
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }

        // Jalankan Inisialisasi
        init();
    </script>
</body>
</html>
