<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Tugas UT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Input Number Spinner Hider */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* Modern UI Utilities */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-dark { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
        
        /* Background Mesh Gradient Orbs */
        .bg-orb-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(255,255,255,0) 70%); z-index: -1; }
        .bg-orb-2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, rgba(255,255,255,0) 70%); z-index: -1; }

        /* Animations */
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(15px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-animate { animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Glowing effects for active states */
        .glow-active { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); border-color: rgba(59, 130, 246, 0.6); }
        .glow-danger { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.6); }
        
        /* Custom Checkbox (Cyber Style) */
        .cyber-checkbox {
            appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #cbd5e1; border-radius: 0.375rem;
            outline: none; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        .cyber-checkbox:checked { border-color: #10b981; background-color: #10b981; }
        .cyber-checkbox:checked::after {
            content: ''; position: absolute; top: 2px; left: 6px; width: 5px; height: 10px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .cyber-checkbox:disabled { cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Background Decoration -->

    <!-- ==================== SCREEN: LOGIN ==================== -->

                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg>

                    <input type="text" id="loginId" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-bold text-slate-800" placeholder="Masukkan ID Pengguna">

                <div>

    </div>

    <!-- ==================== SCREEN: STUDENT DASHBOARD (PRO) ==================== -->

        <!-- Modern Glass Navbar -->

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg>

                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                </span>
                                <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Cloud Sync Active</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 sm:gap-4">
                        <div class="hidden sm:flex bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-extrabold items-center gap-2 border border-slate-200">
                            <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>

                            <span class="hidden sm:inline">Add Course</span>

        <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 mt-8">

                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

            projectId: "unoversitas-terbuka",
            storageBucket: "unoversitas-terbuka.firebasestorage.app",

        let subjects = [];
        let semesterDates = {};
        let unsubSubjects = null, unsubDates = null, unsubAdmin = null;
        let editingMatkulId = null;
        let collapsedSemesters = new Set(); // Tambahan state untuk menyimpan semester yang diminimize

        const appId = "tugas_ut_v3";
        const sessions = [
            { id: 's1', label: 'Sesi 1', isTask: false },
            { id: 's2', label: 'Sesi 2', isTask: false },
            { id: 's3', label: 'Sesi 3', isTask: false, hasTask: true, taskId: 't1', taskLabel: 'Tugas 1' },
            { id: 's4', label: 'Sesi 4', isTask: false },
            { id: 's5', label: 'Sesi 5', isTask: false, hasTask: true, taskId: 't2', taskLabel: 'Tugas 2' },
            { id: 's6', label: 'Sesi 6', isTask: false },
            { id: 's7', label: 'Sesi 7', isTask: false, hasTask: true, taskId: 't3', taskLabel: 'Tugas 3' },
            { id: 's8', label: 'Sesi 8', isTask: false }
        ];

        async function init() {
            const savedRole = localStorage.getItem('ut_role');
            if (savedRole) { checkLocalSession(true); } else { showScreen('login', true); }

            onAuthStateChanged(auth, async (user) => {
                if (!user) { try { await signInAnonymously(auth); } catch (e) { showToast("Gagal koneksi server", "error"); } }
            });

            document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);
            document.getElementById('adminAddUserForm').addEventListener('submit', handleAdminAddUser);
            document.getElementById('addMatkulForm').addEventListener('submit', handleAddMatkul);
            document.getElementById('adminChangePassForm').addEventListener('submit', handleAdminChangePass);
        }

        function checkLocalSession(instant = false) {
            const savedRole = localStorage.getItem('ut_role');
            let savedId = localStorage.getItem('ut_id');

            if (savedRole === 'admin') {
                showScreen('admin', instant);
                setupAdminListeners();
            } else if (savedRole === 'student' && savedId) {
                savedId = savedId.toUpperCase();
                localStorage.setItem('ut_id', savedId);
                userId = savedId;
                document.getElementById('displayUserId').textContent = userId;
                showScreen('student', instant);
                setupStudentListeners();
            } else {
                showScreen('login', instant);
            }
        }

        function showScreen(screen, instant = false) {
            document.getElementById('loginScreen').classList.add('hidden', 'opacity-0');
            document.getElementById('adminScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');

            const executeShow = () => {
                if (screen === 'login') {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    if (instant) document.getElementById('loginScreen').classList.remove('opacity-0');
                    else setTimeout(() => document.getElementById('loginScreen').classList.remove('opacity-0'), 50);
                } else if (screen === 'admin') {
                    document.getElementById('adminScreen').classList.remove('hidden');
                } else if (screen === 'student') {
                    document.getElementById('mainApp').classList.remove('hidden');
                }
            };
            if (instant) { executeShow(); } else { setTimeout(executeShow, 100); }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const rawId = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPass').value;
            const id = rawId.toUpperCase();

            if (id === 'ADMIN') {
                try {
                    const adminDocSnap = await getDoc(doc(db, `artifacts/${appId}/admin_config`, 'credentials'));
                    let validPass = adminDocSnap.exists() && adminDocSnap.data().password ? adminDocSnap.data().password : 'admin';
                    if (pass === validPass) {
                        localStorage.setItem('ut_role', 'admin');
                        checkLocalSession(); showToast("Admin Access Granted", "success");
                    } else { showToast("Invalid Security Key", "error"); }
                } catch (err) { showToast("Verification Failed", "error"); }
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, `artifacts/${appId}/admin_users`, id));
                if (docSnap.exists() && docSnap.data().password === pass) {
                    localStorage.setItem('ut_role', 'student');
                    localStorage.setItem('ut_id', id);
                    checkLocalSession(); showToast(`Workspace Loaded: ${id}`, "success");
                } else { showToast("Invalid ID or Password", "error"); }
            } catch (err) { showToast("Connection Error", "error"); }
        }

        window.handleLogout = function() {
            localStorage.removeItem('ut_role'); localStorage.removeItem('ut_id');
            if(unsubSubjects) unsubSubjects(); if(unsubDates) unsubDates(); if(unsubAdmin) unsubAdmin();
            userId = null; subjects = []; semesterDates = {};
            document.getElementById('loginId').value = ''; document.getElementById('loginPass').value = '';
            showScreen('login'); showToast("Session Terminated", "success");
        }

        function setupAdminListeners() {
            unsubAdmin = onSnapshot(collection(db, `artifacts/${appId}/admin_users`), (snapshot) => {
                const container = document.getElementById('adminUserList'); container.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 flex justify-between items-center group">
                            <div><p class="text-sm font-bold text-white">${docSnap.id}</p><p class="text-[10px] text-emerald-400 font-mono mt-0.5">Key: ${data.password}</p></div>
                            <button onclick="deleteUser('${docSnap.id}')" class="text-slate-500 hover:text-rose-500 bg-slate-900 p-2 rounded-lg transition-colors border border-slate-700 hover:border-rose-500/50"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>`;
                });
            });
        }
        async function handleAdminAddUser(e) {
            e.preventDefault();
            const id = document.getElementById('newUserId').value.trim().toUpperCase();
            const pass = document.getElementById('newUserPass').value.trim();
            if (!id || !pass) return;
            await setDoc(doc(db, `artifacts/${appId}/admin_users`, id), { password: pass, createdAt: Date.now() });
            document.getElementById('adminAddUserForm').reset(); showToast("Identity Provisioned", "success");
        }
        window.deleteUser = function(id) {
            showConfirm(`Revoke access for ${id}?`, async () => { await deleteDoc(doc(db, `artifacts/${appId}/admin_users`, id)); showToast("Access Revoked", "success"); });
        }
        async function handleAdminChangePass(e) {
            e.preventDefault();
            const pass = document.getElementById('newAdminPass').value.trim();
            await setDoc(doc(db, `artifacts/${appId}/admin_config`, 'credentials'), { password: pass }, { merge: true });
            document.getElementById('adminChangePassForm').reset(); showToast("Root Password Updated", "success");
        }

        window.showConfirm = function(message, callback) {
            document.getElementById('confirmMessage').textContent = message; currentConfirmCallback = callback;
            document.getElementById('customConfirm').classList.remove('hidden');
        }
        window.closeConfirm = function() { document.getElementById('customConfirm').classList.add('hidden'); currentConfirmCallback = null; }
        document.getElementById('confirmYesBtn').addEventListener('click', () => { if (currentConfirmCallback) currentConfirmCallback(); closeConfirm(); });

        function showToast(msg, type="info") {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            document.getElementById('toastIcon').innerHTML = type === 'success' 
                ? `<div class="bg-emerald-500 text-white p-1.5 rounded-full"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`
                : `<div class="bg-rose-500 text-white p-1.5 rounded-full"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>`;
            toast.classList.remove('translate-y-24', 'opacity-0'); setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3000);
        }

        function setupStudentListeners() {
            unsubSubjects = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/matkul`), (snapshot) => {
                subjects = []; snapshot.forEach((doc) => { subjects.push({ id: doc.id, ...doc.data() }); }); renderDashboard();
            });
            unsubDates = onSnapshot(collection(db, `artifacts/${appId}/users/${userId}/dates`), (snapshot) => {
                semesterDates = {}; snapshot.forEach((doc) => { semesterDates[doc.id] = doc.data(); }); renderDashboard();
            });
        }
        
        window.openAddModal = function() {
            editingMatkulId = null; document.getElementById('addMatkulForm').reset();
            document.getElementById('modalTitle').textContent = 'Deploy New Course';
            document.getElementById('addModal').classList.remove('hidden');
        }
        window.closeAddModal = function() { document.getElementById('addModal').classList.add('hidden'); }
        window.editMatkul = function(id) {
            const m = subjects.find(s => s.id === id); if (!m) return;
            editingMatkulId = id;
            ['Code', 'Name', 'Semester', 'Kategori', 'Dosen1', 'Dosen2'].forEach(k => document.getElementById(`matkul${k}`).value = m[k.toLowerCase()] || '');
            document.getElementById('modalTitle').textContent = 'Reconfigure Course'; document.getElementById('addModal').classList.remove('hidden');
        }
        async function handleAddMatkul(e) {
            e.preventDefault();
            const data = { code: document.getElementById('matkulCode').value.toUpperCase(), name: document.getElementById('matkulName').value, semester: document.getElementById('matkulSemester').value, kategori: document.getElementById('matkulKategori').value, dosen1: document.getElementById('matkulDosen1').value, dosen2: document.getElementById('matkulDosen2').value };
            const docId = editingMatkulId || `mk_${Date.now()}`;
            if (!editingMatkulId) { data.tasks = {}; data.nilai = {}; data.na = {}; }
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, docId), data, { merge: true });
            closeAddModal(); showToast("Data Synced to Cloud", "success");
        }
        window.deleteMatkul = function(id) { showConfirm("Hapus data mata kuliah ini?", async () => { await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, id)); showToast("Course Deleted", "success"); }); }
        window.toggleTask = async function(mId, tId, v) { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, mId), { tasks: { [tId]: v } }, { merge: true }); }
        window.updateNilai = async function(mId, iId, v) { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, mId), { nilai: { [iId]: v } }, { merge: true }); }
        window.toggleNA = async function(mId, tId, v) { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, mId), { na: { [tId]: v } }, { merge: true }); }
        
        window.toggleDateSettings = function(semId) {
            const p = document.getElementById(`datePanel-${semId}`), i = document.getElementById(`dateIcon-${semId}`);
            p.classList.toggle('hidden'); i.style.transform = p.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }
        
        window.toggleSemester = function(sem) {
            if (collapsedSemesters.has(sem)) {
                collapsedSemesters.delete(sem);
            } else {
                collapsedSemesters.add(sem);
            }
            renderDashboard(); // Re-render untuk merubah posisi dari grid ke tabel
        }

        window.saveDates = async function(semId) {
            const data = {}; sessions.forEach(s => { data[`start_${s.id}`] = document.getElementById(`date_start_${semId}_${s.id}`).value; data[`end_${s.id}`] = document.getElementById(`date_end_${semId}_${s.id}`).value; });
            await setDoc(doc(db, `artifacts/${appId}/users/${userId}/dates`, semId), data); showToast("Timeline Updated", "success");
        }

        function checkStatus(startDate, endDate, isCompleted) {
            if (isCompleted) return { state: 'done', bg: 'bg-emerald-50/50', border: 'border-emerald-200', dot: 'bg-emerald-500', label: 'SELESAI' };
            if (!startDate || !endDate) return { state: 'locked', bg: 'bg-slate-50', border: 'border-slate-200 border-dashed opacity-60', dot: 'bg-slate-300', label: 'LOCKED' };
            
            const now = new Date(), start = new Date(startDate), end = new Date(endDate); end.setHours(23, 59, 59, 999); 
            
            if (now < start) return { state: 'locked', bg: 'bg-slate-50', border: 'border-slate-200 opacity-60', dot: 'bg-slate-300', label: 'WAITING' };
            if (now > end) return { state: 'overdue', bg: 'bg-rose-50/30', border: 'glow-danger', dot: 'bg-rose-500 animate-pulse', label: 'OVERDUE' };
            return { state: 'active', bg: 'bg-indigo-50/20', border: 'glow-active', dot: 'bg-blue-500', label: 'BERJALAN' }; // The powerful state
        }
        function formatDateShort(ds) { if(!ds) return '--/--'; const d = new Date(ds); return `${d.getDate()}/${d.getMonth()+1}`; }

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer'); container.innerHTML = '';
            if (subjects.length === 0) {
                container.innerHTML = `<div class="text-center py-32 glass-panel rounded-[2rem] border border-slate-200 border-dashed"><div class="w-20 h-20 bg-slate-100 rounded-3xl flex items-center justify-center mx-auto mb-6 text-slate-300"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg></div><h3 class="text-xl font-extrabold text-slate-700 mb-2 tracking-tight">No Active Courses</h3><p class="text-slate-500 text-sm font-medium">Deploy your first course using the button above.</p></div>`;
                return;
            }

            const grouped = {}; subjects.forEach(s => { if (!grouped[s.semester]) grouped[s.semester] = []; grouped[s.semester].push(s); });
            
            // Siapkan 2 area: Area Atas (Grid untuk yang di-minimize), dan Area Bawah (Tabel yang terbuka)
            let collapsedHtml = `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 mb-8">`;
            let expandedHtml = `<div class="space-y-12">`;
            let hasCollapsed = false;

            Object.keys(grouped).sort((a,b)=>a-b).forEach(sem => {
                const semDates = semesterDates[`sem_${sem}`] || {};
                
                // Jika semester ini masuk dalam daftar yang diminimize, render sebagai kartu kecil di Grid Atas
                if (collapsedSemesters.has(sem)) {
                    hasCollapsed = true;
                    collapsedHtml += `
                        <div onclick="toggleSemester('${sem}')" class="glass-panel p-4 rounded-2xl border border-slate-200/60 shadow-sm hover:shadow-xl hover:-translate-y-1 hover:border-indigo-400 cursor-pointer transition-all duration-300 group flex flex-col items-center text-center relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div class="w-12 h-12 bg-slate-50 group-hover:bg-indigo-50 text-slate-400 group-hover:text-indigo-600 rounded-2xl flex items-center justify-center mb-3 transition-colors border border-slate-100 shadow-sm">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            </div>
                            <h4 class="font-extrabold text-slate-800 text-sm tracking-tight">Semester ${sem}</h4>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">${grouped[sem].length} Modules</p>
                        </div>`;
                } else {
                    // Jika tidak diminimize, render tabel penuh seperti biasa
                    let html = `
                    <div class="mb-14 relative animate-modalFadeIn">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-4">
                            <!-- Tombol Minimize -->
                            <div class="flex items-center gap-4 cursor-pointer group" onclick="toggleSemester('${sem}')" title="Minimize Semester">
                                <div class="bg-slate-900 group-hover:bg-rose-500 transition-all text-white px-5 py-2.5 rounded-xl font-extrabold text-sm shadow-xl shadow-slate-200 flex items-center gap-3">
                                    <span>SEMESTER ${sem}</span>
                                    <svg class="w-4 h-4 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>
                                </div>
                                <span class="font-bold text-slate-400 text-sm tracking-wide bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">${grouped[sem].length} Modules</span>
                            </div>
                            
                            <button onclick="toggleDateSettings('sem_${sem}')" class="flex items-center gap-2 text-sm text-indigo-600 font-extrabold bg-indigo-50 hover:bg-indigo-100 px-5 py-2.5 rounded-xl transition-all border border-indigo-100 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span>Timeline Setup</span>
                                <svg id="dateIcon-sem_${sem}" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>

                        <div id="datePanel-sem_${sem}" class="hidden glass-panel border border-slate-200 p-6 rounded-3xl mb-6 shadow-xl relative overflow-hidden">
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 relative z-10">`;
                        
                        sessions.forEach(ses => {
                            html += `
                                <div class="bg-white/60 p-3.5 rounded-2xl border border-slate-200/60 shadow-sm">
                                    <div class="font-extrabold text-[10px] text-indigo-600 uppercase mb-2 tracking-widest">${ses.label}</div>
                                    <input type="date" id="date_start_sem_${sem}_${ses.id}" value="${semDates[`start_${ses.id}`]||''}" class="w-full text-[10px] p-2 mb-2 border border-slate-200 rounded-xl bg-white outline-none focus:border-indigo-500 font-bold text-slate-700">
                                    <input type="date" id="date_end_sem_${sem}_${ses.id}" value="${semDates[`end_${ses.id}`]||''}" class="w-full text-[10px] p-2 border border-slate-200 rounded-xl bg-white outline-none focus:border-indigo-500 font-bold text-slate-700">
                                </div>`;
                        });

                    html += `</div>
                            <div class="mt-5 flex justify-end relative z-10">
                                <button onclick="saveDates('sem_${sem}')" class="bg-slate-900 text-white text-sm font-bold px-8 py-3 rounded-xl hover:bg-indigo-600 shadow-lg transition-all">Update Timeline</button>
                            </div>
                        </div>

                        <div class="glass-panel rounded-[24px] border border-slate-200/60 shadow-xl overflow-auto max-h-[75vh] hide-scrollbar">
                            <table class="w-full text-left border-collapse min-w-[1100px]">
                                <thead>
                                    <tr class="sticky top-0 z-30 bg-slate-50/95 border-b border-slate-200 text-[10px] font-extrabold text-slate-500 uppercase tracking-widest backdrop-blur-xl shadow-sm">
                                        <th class="p-5 w-72 sticky left-0 top-0 z-40 border-r border-slate-200 bg-slate-50/95 backdrop-blur-xl">Course Information</th>`;
                                        
                                    sessions.forEach(ses => {
                                        const ds = formatDateShort(semDates[`start_${ses.id}`]), de = formatDateShort(semDates[`end_${ses.id}`]);
                                        html += `<th class="p-4 text-center min-w-[120px] border-r border-slate-200 last:border-0">
                                            <div class="flex flex-col items-center gap-1.5">
                                                <span class="text-slate-700">${ses.label}</span>
                                                <span class="text-[9px] bg-slate-200/50 text-slate-500 px-2 py-0.5 rounded-md border border-slate-200/50 tracking-normal">${ds} - ${de}</span>
                                            </div>
                                        </th>`;
                                    });

                                html += `</tr></thead><tbody class="divide-y divide-slate-100/50">`;

                    grouped[sem].forEach(matkul => {
                        let doneCount = 0, totalCount = 11;
                        sessions.forEach(s => {
                            const dId = `diskusi_${s.id}`;
                            if(matkul.na && matkul.na[dId]) totalCount--;
                            else if(matkul.tasks && matkul.tasks[dId]) doneCount++;

                            if(s.hasTask) {
                                const tId = `tugas_${s.id}`;
                                if(matkul.na && matkul.na[tId]) totalCount--;
                                else if(matkul.tasks && matkul.tasks[tId]) doneCount++;
                            }
                        });
                        if (totalCount <= 0) totalCount = 1;
                        const progressPct = Math.round((doneCount / totalCount) * 100);
                        const progressColor = progressPct === 100 ? 'bg-emerald-500' : 'bg-indigo-500';

                        html += `<tr class="group hover:bg-white/60 transition-colors">
                                    <td class="p-5 sticky left-0 z-10 border-r border-slate-100 bg-white/80 backdrop-blur-md group-hover:bg-white transition-colors align-top">
                                        <div class="relative">
                                            <div class="absolute -top-2 -right-2 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-all z-20">
                                                <button onclick="editMatkul('${matkul.id}')" class="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 bg-white rounded-lg p-2 shadow-md border border-slate-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                                <button onclick="deleteMatkul('${matkul.id}')" class="text-slate-400 hover:text-rose-600 hover:bg-rose-50 bg-white rounded-lg p-2 shadow-md border border-slate-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                            </div>
                                            
                                            <h3 class="font-extrabold text-slate-800 text-sm leading-tight mb-1 text-balance pr-12">${matkul.name}</h3>
                                            <div class="flex items-center gap-2 mb-3">
                                                <p class="text-[11px] font-bold text-slate-400 italic">${matkul.code}</p>
                                                <span class="inline-block px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[8px] font-extrabold uppercase tracking-widest rounded-md border border-indigo-100">${matkul.kategori}</span>
                                            </div>
                                            
                                            <div class="mb-4 pr-4">
                                                <div class="flex justify-between text-[9px] font-extrabold text-slate-400 mb-1">
                                                    <span>PROGRESS</span>
                                                    <span class="${progressPct===100?'text-emerald-500':'text-indigo-500'}">${progressPct}%</span>
                                                </div>
                                                <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                                    <div class="${progressColor} h-1.5 rounded-full transition-all duration-1000 ease-out" style="width: ${progressPct}%"></div>
                                                </div>
                                            </div>

                                            <div class="text-[10px] text-slate-500 font-medium space-y-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                                <div class="flex items-center gap-1.5"><svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> <span class="truncate w-48">${matkul.dosen1}</span></div>
                                                ${matkul.dosen2 ? `<div class="flex items-center gap-1.5"><svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> <span class="truncate w-48">${matkul.dosen2}</span></div>` : ''}
                                            </div>
                                        </div>
                                    </td>`;

                        sessions.forEach(ses => {
                            const start = semDates[`start_${ses.id}`], end = semDates[`end_${ses.id}`];
                            
                            const isDDone = matkul.tasks && matkul.tasks[`diskusi_${ses.id}`] ? true : false;
                            const dStat = checkStatus(start, end, isDDone);
                            const isDNA = matkul.na && matkul.na[`diskusi_${ses.id}`] ? true : false;
                            
                            const isTDone = matkul.tasks && matkul.tasks[`tugas_${ses.id}`] ? true : false;
                            const tStat = checkStatus(start, end, isTDone);
                            const isTNA = matkul.na && matkul.na[`tugas_${ses.id}`] ? true : false;

                            html += `<td class="p-3 border-r border-slate-100/50 last:border-0 align-top">
                                <div class="flex flex-col gap-3 h-full">
                                    <div class="relative rounded-2xl p-3 border ${isDNA ? 'border-slate-200 bg-slate-100 opacity-60 grayscale' : `${dStat.border} ${dStat.bg}`} transition-all duration-300">
                                        ${isDNA ? `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1 bg-slate-200 px-1.5 py-0.5 rounded-full border border-slate-300 shadow-sm">
                                            <span class="text-[8px] font-extrabold text-slate-500 tracking-widest">TIDAK ADA</span>
                                        </div>` :
                                        dStat.state === 'active' ? `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1.5 bg-white px-2 py-0.5 rounded-full border border-blue-200 shadow-sm">
                                            <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-blue-500"></span></span>
                                            <span class="text-[8px] font-extrabold text-blue-600 tracking-widest">${dStat.label}</span>
                                        </div>` : `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1 bg-white px-1.5 py-0.5 rounded-full border border-slate-100 shadow-sm">
                                            <div class="w-1.5 h-1.5 rounded-full ${dStat.dot}"></div><span class="text-[8px] font-extrabold text-slate-500 tracking-widest">${dStat.label}</span>
                                        </div>
                                        `}
                                        
                                        <div class="flex items-center justify-between mb-3 mt-1">
                                            <label class="flex items-center gap-3 cursor-pointer">
                                                <input type="checkbox" ${isDDone ? 'checked' : ''} ${dStat.state==='locked' || isDNA ? 'disabled' : ''} onchange="toggleTask('${matkul.id}', 'diskusi_${ses.id}', this.checked)" class="cyber-checkbox flex-shrink-0">
                                                <span class="text-[11px] font-extrabold text-slate-700 ${isDDone || isDNA ? 'line-through opacity-40' : ''}">Diskusi</span>
                                            </label>
                                            <button onclick="toggleNA('${matkul.id}', 'diskusi_${ses.id}', ${!isDNA})" class="text-slate-400 hover:text-rose-500 transition-colors" title="${isDNA ? 'Aktifkan Kembali' : 'Tandai Tidak Ada'}">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                                            </button>
                                        </div>
                                        <input type="number" placeholder="Nilai" value="${matkul.nilai && matkul.nilai[`nilai_d_${ses.id}`] ? matkul.nilai[`nilai_d_${ses.id}`] : ''}" onchange="updateNilai('${matkul.id}', 'nilai_d_${ses.id}', this.value)" ${dStat.state==='locked' || isDNA ? 'disabled' : ''} class="w-full bg-white/80 border border-slate-200 rounded-lg text-[11px] px-2 py-1.5 text-center font-extrabold text-slate-800 focus:border-indigo-500 outline-none transition-all disabled:opacity-50 hover:shadow-sm">
                                    </div>`;

                            if (ses.hasTask) {
                                html += `
                                    <div class="mt-auto relative rounded-2xl p-3 border ${isTNA ? 'border-slate-200 bg-slate-100 opacity-60 grayscale' : `${tStat.border} ${tStat.bg}`} transition-all duration-300">
                                        ${isTNA ? `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1 bg-slate-200 px-1.5 py-0.5 rounded-full border border-slate-300 shadow-sm">
                                            <span class="text-[8px] font-extrabold text-slate-500 tracking-widest">TIDAK ADA</span>
                                        </div>` :
                                        tStat.state === 'active' ? `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1.5 bg-white px-2 py-0.5 rounded-full border border-indigo-200 shadow-sm">
                                            <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-indigo-500"></span></span>
                                            <span class="text-[8px] font-extrabold text-indigo-600 tracking-widest">${tStat.label}</span>
                                        </div>` : `
                                        <div class="absolute -top-2 right-2 flex items-center gap-1 bg-white px-1.5 py-0.5 rounded-full border border-slate-100 shadow-sm">
                                            <div class="w-1.5 h-1.5 rounded-full ${tStat.dot}"></div><span class="text-[8px] font-extrabold text-slate-500 tracking-widest">${tStat.label}</span>
                                        </div>
                                        `}
                                        
                                        <div class="flex items-center justify-between mb-3 mt-1">
                                            <label class="flex items-center gap-3 cursor-pointer">
                                                <input type="checkbox" ${isTDone ? 'checked' : ''} ${tStat.state==='locked' || isTNA ? 'disabled' : ''} onchange="toggleTask('${matkul.id}', 'tugas_${ses.id}', this.checked)" class="cyber-checkbox flex-shrink-0">
                                                <span class="text-[11px] font-extrabold text-slate-800 ${isTDone || isTNA ? 'line-through opacity-40' : ''}">${ses.taskLabel}</span>
                                            </label>
                                            <button onclick="toggleNA('${matkul.id}', 'tugas_${ses.id}', ${!isTNA})" class="text-slate-400 hover:text-rose-500 transition-colors" title="${isTNA ? 'Aktifkan Kembali' : 'Tandai Tidak Ada'}">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                                            </button>
                                        </div>
                                        <input type="number" placeholder="Nilai" value="${matkul.nilai && matkul.nilai[`nilai_t_${ses.id}`] ? matkul.nilai[`nilai_t_${ses.id}`] : ''}" onchange="updateNilai('${matkul.id}', 'nilai_t_${ses.id}', this.value)" ${tStat.state==='locked' || isTNA ? 'disabled' : ''} class="w-full bg-white/80 border border-slate-200 rounded-lg text-[11px] px-2 py-1.5 text-center font-extrabold text-indigo-700 focus:border-indigo-500 outline-none transition-all disabled:opacity-50 hover:shadow-sm">
                                    </div>`;
                            }

                            html += `</div></td>`;
                        });

                        html += `</tr>`;
                    });

                    html += `</tbody></table></div></div>`; 
                    expandedHtml += html;
                }
            });

            collapsedHtml += `</div>`;
            expandedHtml += `</div>`;

            container.innerHTML = (hasCollapsed ? collapsedHtml : '') + expandedHtml;
        }

        init();
    </script>
</body>
</html>
