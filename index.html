<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tugas UT V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Custom Scrollbar */
        .table-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Modern Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 0.375rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: white;
        }
        .custom-checkbox:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
            transform: scale(1.05);
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .custom-checkbox:disabled {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }
        
        /* Modal Transitions */
        #modalBackdrop { transition: opacity 0.3s ease-out; }
        #modalPanel { transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
        
        /* Date Input Styling in Dark Mode Header */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"></path><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">E-Learning Tracker</h1>
                        <p class="text-xs text-slate-500 font-medium">Universitas Terbuka</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="connectionStatus" class="px-3 py-1.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-xs font-semibold flex items-center shadow-sm transition-colors">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-2 animate-pulse"></span> Menyambungkan...
                    </div>
                    <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md hover:shadow-lg shadow-indigo-200 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Tambah Matkul
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto p-4 sm:p-6 lg:p-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex items-center group hover:shadow-md transition-shadow">
                <div class="bg-slate-100 p-4 rounded-2xl text-slate-600 mr-5 group-hover:scale-110 transition-transform">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                    <p class="text-sm text-slate-500 font-medium mb-1">Total Mata Kuliah</p>
                    <p class="text-3xl font-extrabold text-slate-900" id="statTotalMatkul">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex items-center group hover:shadow-md transition-shadow">
                <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl text-emerald-600 mr-5 group-hover:scale-110 transition-transform">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p class="text-sm text-slate-500 font-medium mb-1">Diselesaikan (Sesi/Tugas)</p>
                    <p class="text-3xl font-extrabold text-emerald-600" id="statSelesai">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex items-center group hover:shadow-md transition-shadow">
                <div class="bg-amber-50 border border-amber-100 p-4 rounded-2xl text-amber-600 mr-5 group-hover:scale-110 transition-transform">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p class="text-sm text-slate-500 font-medium mb-1">Menunggu Dikerjakan</p>
                    <p class="text-3xl font-extrabold text-amber-500" id="statMenunggu">0</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="table-container overflow-x-auto pb-4">
                <table class="w-full text-sm text-left border-collapse" style="min-width: 1400px;">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50/80 backdrop-blur border-b border-slate-200">
                        <tr>
                            <th class="sticky left-0 bg-slate-50/95 z-20 px-6 py-5 border-r border-slate-200 w-72 min-w-[18rem] font-semibold tracking-wider">
                                Mata Kuliah & Informasi
                            </th>
                            <th class="px-3 py-5 text-center min-w-[130px] font-semibold">Sesi 1</th>
                            <th class="px-3 py-5 text-center min-w-[130px] font-semibold">Sesi 2</th>
                            <th class="px-3 py-5 text-center min-w-[160px] font-semibold text-indigo-700 bg-indigo-50/50">Sesi 3 & Tugas 1</th>
                            <th class="px-3 py-5 text-center min-w-[130px] font-semibold">Sesi 4</th>
                            <th class="px-3 py-5 text-center min-w-[160px] font-semibold text-indigo-700 bg-indigo-50/50">Sesi 5 & Tugas 2</th>
                            <th class="px-3 py-5 text-center min-w-[130px] font-semibold">Sesi 6</th>
                            <th class="px-3 py-5 text-center min-w-[160px] font-semibold text-indigo-700 bg-indigo-50/50">Sesi 7 & Tugas 3</th>
                            <th class="px-3 py-5 text-center min-w-[130px] font-semibold">Sesi 8</th>
                            <th class="px-4 py-5 text-center w-16">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Data render dinamis -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Tambah Matkul -->
    <div id="addModal" class="hidden relative z-50" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity"></div>

        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <!-- Modal Panel -->
                <div id="modalPanel" class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95 sm:my-8 sm:w-full sm:max-w-3xl border border-slate-100">
                    
                    <!-- Header Modal -->
                    <div class="bg-white px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900" id="modal-title">Tambah Mata Kuliah</h3>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-2 rounded-full transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- Body Modal (Form) -->
                    <form id="addMatkulForm" class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nama Mata Kuliah</label>
                                <input type="text" id="nama" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800" placeholder="Contoh: Manajemen Pemasaran">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kode MK</label>
                                <input type="text" id="kode" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all uppercase text-slate-800 font-mono" placeholder="Contoh: EKMA4116">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Semester</label>
                                <select id="semester" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800 appearance-none">
                                    <option value="Semester 1">Semester 1</option>
                                    <option value="Semester 2">Semester 2</option>
                                    <option value="Semester 3">Semester 3</option>
                                    <option value="Semester 4">Semester 4</option>
                                    <option value="Semester 5">Semester 5</option>
                                    <option value="Semester 6">Semester 6</option>
                                    <option value="Semester 7">Semester 7</option>
                                    <option value="Semester 8">Semester 8</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kategori</label>
                                <select id="kategori" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800 appearance-none">
                                    <option value="Wajib">Wajib</option>
                                    <option value="Pilihan">Pilihan</option>
                                    <option value="TAP">TAP</option>
                                    <option value="Ulang / SP">Ulang / SP</option>
                                </select>
                            </div>
                            
                            <div></div> <!-- Spacer -->

                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Dosen 1 (Wajib)</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </div>
                                    <input type="text" id="dosen1" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800" placeholder="Nama Tutor Utama">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Dosen 2 (Opsional)</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </div>
                                    <input type="text" id="dosen2" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-slate-800" placeholder="Nama Tutor Pendamping">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Footer Modal -->
                        <div class="mt-8 pt-5 border-t border-slate-100 flex justify-end gap-3">
                            <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-xl font-semibold hover:bg-slate-50 transition-colors">
                                Batal
                            </button>
                            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-md hover:shadow-lg shadow-indigo-200 transition-all">
                                Simpan Mata Kuliah
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 transform transition-all duration-300 translate-y-24 opacity-0 bg-white rounded-xl shadow-xl border border-slate-100 p-4 flex items-center z-[60] max-w-sm">
        <div id="toastIcon" class="mr-3 flex-shrink-0"></div>
        <div id="toastMessage" class="text-sm font-semibold text-slate-700"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase dari User
        const firebaseConfig = {
            apiKey: "AIzaSyB0RWNNQ-wxedZDlEEADkRpI5HmuCmgeiU",
            authDomain: "unoversitas-terbuka.firebaseapp.com",
            projectId: "unoversitas-terbuka",
            storageBucket: "unoversitas-terbuka.firebasestorage.app",
            messagingSenderId: "333591041068",
            appId: "1:333591041068:web:9a68ca3d9b13443a65ed89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State Aplikasi
        let userId = null;
        let subjects = [];
        let semesterDates = {};
        
        // Aturan Kolom (8 Sesi, dimana Sesi 3, 5, 7 terdapat tugas digabung dalam 1 kolom)
        const SESSIONS = [
            { id: 's1', label: 'Diskusi 1' },
            { id: 's2', label: 'Diskusi 2' },
            { id: 's3', label: 'Diskusi 3', hasTask: true, taskId: 't1', taskLabel: 'Tugas 1' },
            { id: 's4', label: 'Diskusi 4' },
            { id: 's5', label: 'Diskusi 5', hasTask: true, taskId: 't2', taskLabel: 'Tugas 2' },
            { id: 's6', label: 'Diskusi 6' },
            { id: 's7', label: 'Diskusi 7', hasTask: true, taskId: 't3', taskLabel: 'Tugas 3' },
            { id: 's8', label: 'Diskusi 8' }
        ];

        async function init() {
            try {
                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        updateConnectionStatus(true);
                        setupRealtimeListeners();
                    } else {
                        updateConnectionStatus(false);
                    }
                });
            } catch (error) {
                console.error("Auth Error:", error);
                updateConnectionStatus(false);
                showToast("Gagal terhubung ke database.", "error");
            }

            document.getElementById('addMatkulForm').addEventListener('submit', handleAddMatkul);
        }

        function updateConnectionStatus(isConnected) {
            const statusEl = document.getElementById('connectionStatus');
            if (isConnected) {
                statusEl.className = "px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold flex items-center shadow-sm transition-colors";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-2"></span> Tersambung';
            } else {
                statusEl.className = "px-3 py-1.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-full text-xs font-semibold flex items-center shadow-sm transition-colors";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-2"></span> Terputus';
            }
        }

        // Modal Functions
        window.openModal = function() {
            const modal = document.getElementById('addModal');
            const backdrop = document.getElementById('modalBackdrop');
            const panel = document.getElementById('modalPanel');
            
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth;
            
            backdrop.classList.add('opacity-100');
            backdrop.classList.remove('opacity-0');
            
            panel.classList.add('opacity-100', 'translate-y-0', 'scale-100');
            panel.classList.remove('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
        }

        window.closeModal = function() {
            const backdrop = document.getElementById('modalBackdrop');
            const panel = document.getElementById('modalPanel');
            
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            
            panel.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
            panel.classList.add('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
            
            setTimeout(() => {
                document.getElementById('addModal').classList.add('hidden');
                document.getElementById('addMatkulForm').reset();
            }, 300); // Wait for transition
        }

        function setupRealtimeListeners() {
            if (!userId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            
            const subjectsRef = collection(db, `artifacts/${appId}/users/${userId}/matkul`);
            onSnapshot(subjectsRef, (snapshot) => {
                subjects = [];
                snapshot.forEach((doc) => { subjects.push({ id: doc.id, ...doc.data() }); });
                renderTable();
            }, (error) => { console.error(error); });

            const datesRef = collection(db, `artifacts/${appId}/users/${userId}/dates`);
            onSnapshot(datesRef, (snapshot) => {
                semesterDates = {};
                snapshot.forEach((doc) => { semesterDates[doc.id] = doc.data(); });
                renderTable();
            }, (error) => { console.error(error); });
        }

        async function handleAddMatkul(e) {
            e.preventDefault();
            if (!userId) return showToast("Sistem belum siap", "error");

            const matkulId = 'mk_' + Date.now();
            const data = {
                nama: document.getElementById('nama').value.trim(),
                kode: document.getElementById('kode').value.trim().toUpperCase(),
                semester: document.getElementById('semester').value,
                kategori: document.getElementById('kategori').value,
                dosen1: document.getElementById('dosen1').value.trim(),
                dosen2: document.getElementById('dosen2').value.trim(),
                progress: {},
                nilai: {}
            };

            SESSIONS.forEach(sesi => {
                data.progress[sesi.id] = false;
                data.nilai[sesi.id] = '';
                if (sesi.hasTask) {
                    data.progress[sesi.taskId] = false;
                    data.nilai[sesi.taskId] = '';
                }
            });

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            try {
                await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId), data);
                closeModal();
                showToast("Mata kuliah berhasil ditambahkan", "success");
            } catch (error) {
                showToast("Gagal menyimpan mata kuliah", "error");
            }
        }

        window.updateProgress = async function(matkulId, key, isChecked) {
            if (!userId) return;
            const subject = subjects.find(s => s.id === matkulId);
            if (!subject) return;

            subject.progress[key] = isChecked;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            try { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId), subject); } 
            catch (error) { showToast("Gagal mengupdate status", "error"); }
        }

        window.updateNilai = async function(matkulId, key, value) {
            if (!userId) return;
            const subject = subjects.find(s => s.id === matkulId);
            if (!subject) return;

            subject.nilai[key] = value;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            try { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId), subject); } 
            catch (error) { showToast("Gagal menyimpan nilai", "error"); }
        }

        window.updateDate = async function(semester, sesiId, type, value) {
            if (!userId) return;
            if (!semesterDates[semester]) semesterDates[semester] = {};
            if (!semesterDates[semester][sesiId]) semesterDates[semester][sesiId] = { start: '', end: '' };
            
            semesterDates[semester][sesiId][type] = value;
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            try { await setDoc(doc(db, `artifacts/${appId}/users/${userId}/dates`, semester), semesterDates[semester]); } 
            catch (error) { showToast("Gagal menyimpan tanggal", "error"); }
        }

        window.hapusMatkul = async function(matkulId) {
            if (!userId) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-ut-new';
            try {
                await deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/matkul`, matkulId));
                showToast("Mata kuliah dihapus", "success");
            } catch (error) { showToast("Gagal menghapus", "error"); }
        }

        function checkDateStatus(start, end) {
            if (!start || !end) return { status: 'none', bgCard: 'bg-white', border: 'border-slate-200' };
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const sDate = new Date(start); sDate.setHours(0,0,0,0);
            const eDate = new Date(end); eDate.setHours(23,59,59,999);
            
            if (today < sDate) return { status: 'belum', bgCard: 'bg-slate-50', border: 'border-slate-200', opacity: 'opacity-60' };
            if (today > eDate) return { status: 'lewat', bgCard: 'bg-rose-50/30', border: 'border-rose-200', tag: 'bg-rose-100 text-rose-700' };
            return { status: 'aktif', bgCard: 'bg-indigo-50/30', border: 'border-indigo-200', tag: 'bg-indigo-100 text-indigo-700' };
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalMatkul = subjects.length;
            let totalSelesai = 0;
            let totalTugas = 0;

            const grouped = subjects.reduce((acc, sub) => {
                if (!acc[sub.semester]) acc[sub.semester] = [];
                acc[sub.semester].push(sub);
                return acc;
            }, {});

            const sortedSemesters = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

            sortedSemesters.forEach(semester => {
                const dates = semesterDates[semester] || {};
                
                // --- BARIS SEMESTER (HEADER GROUP) ---
                let semesterRowHtml = `
                    <tr class="bg-indigo-900 border-b border-indigo-950">
                        <td class="px-6 py-4 sticky left-0 z-20 bg-indigo-900 text-white shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                            <div class="font-bold text-lg flex items-center gap-2">
                                <svg class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                ${semester}
                            </div>
                            <div class="text-xs text-indigo-300 mt-1 font-medium tracking-wide">PENGATURAN TANGGAL SESI:</div>
                        </td>
                `;

                SESSIONS.forEach(sesi => {
                    const sDates = dates[sesi.id] || { start: '', end: '' };
                    const cellBg = sesi.hasTask ? 'bg-indigo-800/50' : '';
                    semesterRowHtml += `
                        <td class="px-2 py-3 text-center border-r border-indigo-800 align-bottom ${cellBg}">
                            <div class="flex flex-col gap-1.5 items-center justify-end">
                                <input type="date" value="${sDates.start}" onchange="updateDate('${semester}', '${sesi.id}', 'start', this.value)" class="text-[11px] px-1.5 py-1 rounded-md bg-indigo-950/50 text-indigo-100 border border-indigo-700 focus:ring-1 focus:ring-indigo-300 w-[110px] outline-none">
                                <span class="text-[10px] text-indigo-400 font-bold">s/d</span>
                                <input type="date" value="${sDates.end}" onchange="updateDate('${semester}', '${sesi.id}', 'end', this.value)" class="text-[11px] px-1.5 py-1 rounded-md bg-indigo-950/50 text-indigo-100 border border-indigo-700 focus:ring-1 focus:ring-indigo-300 w-[110px] outline-none">
                            </div>
                        </td>
                    `;
                });
                semesterRowHtml += `<td class="bg-indigo-900 border-b border-indigo-950"></td></tr>`;
                tbody.insertAdjacentHTML('beforeend', semesterRowHtml);

                // --- BARIS MATA KULIAH ---
                grouped[semester].forEach(sub => {
                    let mkRowHtml = `
                        <tr class="bg-white hover:bg-slate-50/80 transition-colors group">
                            <td class="px-6 py-5 sticky left-0 bg-white group-hover:bg-slate-50/80 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] align-top border-r border-slate-100">
                                <div class="flex items-center gap-2 mb-1.5">
                                    <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">${sub.kode}</span>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${sub.kategori === 'Wajib' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}">${sub.kategori}</span>
                                </div>
                                <div class="text-sm font-bold text-slate-900 mb-3 leading-snug pr-4">${sub.nama}</div>
                                
                                <div class="bg-slate-50 rounded-lg p-2.5 border border-slate-100">
                                    <div class="flex items-center gap-2 text-xs text-slate-600">
                                        <div class="w-5 h-5 rounded bg-white flex items-center justify-center border border-slate-200 text-slate-400 flex-shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
                                        <span class="font-medium truncate" title="${sub.dosen1}">${sub.dosen1}</span>
                                    </div>
                                    ${sub.dosen2 ? `
                                    <div class="flex items-center gap-2 text-xs text-slate-500 mt-1.5">
                                        <div class="w-5 h-5 rounded bg-white flex items-center justify-center border border-slate-200 text-slate-300 flex-shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></div>
                                        <span class="truncate" title="${sub.dosen2}">${sub.dosen2}</span>
                                    </div>` : ''}
                                </div>
                            </td>
                    `;

                    SESSIONS.forEach(sesi => {
                        const sDates = dates[sesi.id] || { start: '', end: '' };
                        const st = checkDateStatus(sDates.start, sDates.end);
                        const isLocked = st.status === 'belum';
                        const isOverdue = st.status === 'lewat';
                        const extraCellClass = sesi.hasTask ? 'bg-indigo-50/20' : '';

                        totalTugas++; 
                        if (sub.progress[sesi.id]) totalSelesai++;
                        if (sesi.hasTask) { totalTugas++; if (sub.progress[sesi.taskId]) totalSelesai++; }

                        // Komponen Diskusi
                        const disDone = sub.progress[sesi.id];
                        const disVal = sub.nilai[sesi.id] || '';
                        const textClass = disDone ? 'text-slate-400 line-through' : 'text-slate-700 font-semibold';
                        const inputStyle = disVal ? 'text-indigo-600 font-bold border-indigo-300 bg-indigo-50/50' : 'text-slate-600 border-slate-200 bg-transparent';
                        
                        // Border logic: Merah HANYA jika terlewat DAN belum selesai
                        const cardBorder = (isOverdue && !disDone) ? 'border-rose-300 ring-1 ring-rose-100' : st.border;

                        let cellContent = `
                            <div class="p-3 rounded-xl border ${st.bgCard} ${cardBorder} ${st.opacity || ''} h-full flex flex-col justify-between transition-colors">
                                ${isOverdue && !disDone ? `<div class="absolute -top-2 -right-2 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md shadow-sm animate-pulse">OVERDUE</div>` : ''}
                                
                                <div class="relative">
                                    <div class="flex items-start gap-2.5 mb-3">
                                        <input type="checkbox" class="custom-checkbox flex-shrink-0 mt-0.5" ${disDone ? 'checked' : ''} ${isLocked ? 'disabled' : ''} onchange="updateProgress('${sub.id}', '${sesi.id}', this.checked)">
                                        <span class="text-xs ${textClass} leading-tight pt-0.5">${sesi.label}</span>
                                    </div>
                                    <div class="relative">
                                        <span class="absolute left-2.5 top-1.5 text-[10px] font-semibold text-slate-400">Nilai:</span>
                                        <input type="number" placeholder="-" value="${disVal}" ${isLocked ? 'disabled' : ''} onblur="updateNilai('${sub.id}', '${sesi.id}', this.value)" class="w-full pl-10 pr-2 py-1.5 rounded-lg text-sm border focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all ${inputStyle} placeholder-slate-300">
                                    </div>
                                </div>
                        `;

                        // Tambahan jika ada Tugas
                        if (sesi.hasTask) {
                            const taskDone = sub.progress[sesi.taskId];
                            const taskVal = sub.nilai[sesi.taskId] || '';
                            const tTextClass = taskDone ? 'text-slate-400 line-through' : 'text-indigo-700 font-bold';
                            const tInputStyle = taskVal ? 'text-indigo-700 font-bold border-indigo-400 bg-indigo-50' : 'text-slate-600 border-slate-200 bg-white/50';
                            
                            // Validasi Overdue khusus tugas
                            const tBorder = (isOverdue && !taskDone) ? 'border-rose-400' : 'border-indigo-100';

                            cellContent += `
                                <div class="w-full h-px bg-slate-200/80 my-3.5"></div>
                                
                                <div class="bg-white/60 p-2.5 rounded-lg border ${tBorder} relative">
                                    ${isOverdue && !taskDone ? `<div class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-3 h-3 rounded-full animate-ping"></div><div class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-3 h-3 rounded-full"></div>` : ''}
                                    <div class="flex items-start gap-2.5 mb-2.5">
                                        <input type="checkbox" class="custom-checkbox flex-shrink-0 !border-indigo-300 mt-0.5" ${taskDone ? 'checked' : ''} ${isLocked ? 'disabled' : ''} onchange="updateProgress('${sub.id}', '${sesi.taskId}', this.checked)">
                                        <span class="text-xs ${tTextClass} leading-tight pt-0.5">${sesi.taskLabel}</span>
                                    </div>
                                    <div class="relative">
                                        <span class="absolute left-2.5 top-1.5 text-[10px] font-semibold text-slate-400">Nilai:</span>
                                        <input type="number" placeholder="-" value="${taskVal}" ${isLocked ? 'disabled' : ''} onblur="updateNilai('${sub.id}', '${sesi.taskId}', this.value)" class="w-full pl-10 pr-2 py-1.5 rounded-lg text-sm border focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all ${tInputStyle} placeholder-slate-300">
                                    </div>
                                </div>
                            `;
                        }

                        cellContent += `</div>`;
                        mkRowHtml += `<td class="px-2 py-3 border-r border-slate-100 align-top ${extraCellClass} relative">${cellContent}</td>`;
                    });

                    // Tombol Hapus Modern
                    mkRowHtml += `
                        <td class="px-2 py-3 text-center align-middle">
                            <button onclick="hapusMatkul('${sub.id}')" class="p-2.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all border border-transparent hover:border-rose-100" title="Hapus Mata Kuliah">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>`;

                    tbody.insertAdjacentHTML('beforeend', mkRowHtml);
                });
            });

            if (subjects.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="px-6 py-20 text-center text-slate-500 font-medium">
                    <div class="flex flex-col items-center justify-center">
                        <div class="bg-slate-100 p-4 rounded-full mb-4 text-slate-400">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        </div>
                        <p class="text-lg">Belum ada mata kuliah yang ditambahkan.</p>
                        <p class="text-sm mt-1 text-slate-400">Klik tombol "Tambah Matkul" di pojok kanan atas untuk memulai.</p>
                    </div>
                </td></tr>`;
            }

            document.getElementById('statTotalMatkul').textContent = totalMatkul;
            document.getElementById('statSelesai').textContent = totalSelesai;
            document.getElementById('statMenunggu').textContent = totalTugas - totalSelesai;
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');

            msg.textContent = message;
            
            if (type === "success") {
                toast.className = "fixed bottom-6 right-6 transform transition-all duration-300 bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-slate-100 p-4 flex items-center z-[60] max-w-sm translate-y-0 opacity-100 border-l-4 border-l-emerald-500";
                icon.innerHTML = `<div class="bg-emerald-100 p-1.5 rounded-full"><svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>`;
            } else {
                toast.className = "fixed bottom-6 right-6 transform transition-all duration-300 bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-slate-100 p-4 flex items-center z-[60] max-w-sm translate-y-0 opacity-100 border-l-4 border-l-rose-500";
                icon.innerHTML = `<div class="bg-rose-100 p-1.5 rounded-full"><svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></div>`;
            }

            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3500);
        }

        window.onload = init;
    </script>
</body>
</html>
